[project]
name = "pptx-compiler"
version = "0.1.0"
description = "Compilador de un DSL de presentaciones a PPTX con transiciones Morph"
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=1.0",
    "pydantic>=2.0",
    "lxml>=5.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pptxc = "pptx_compiler.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
